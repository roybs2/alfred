<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="35%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#1c1925"/>
      <stop offset="55%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#111115"/>
    </radialGradient>
    <linearGradient id="lav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2afff"/>
      <stop offset="100%" stop-color="#8f72e0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
