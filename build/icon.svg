    <path d="M 300 392 L 492 472 L 492 552 L 300 632 C 274 642 256 622 256 596 L 256 428 C 256 402 274 382 300 392 Z" fill="url(#lav)"/>
    <path d="M 724 392 L 532 472 L 532 552 L 724 632 C 750 642 768 622 768 596 L 768 428 C 768 402 750 382 724 392 Z" fill="url(#lav)"/>
    <circle cx="512" cy="512" r="46" fill="#0f0e13"/>
    <circle cx="512" cy="512" r="46" fill="none" stroke="url(#lav)" stroke-width="10"/>
  </g>
